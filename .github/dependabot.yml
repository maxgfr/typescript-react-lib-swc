version: 2
updates:
  # Grouped so the lockfile is refreshed in one PR: security fixes for
  # transitive dependencies then land with their parents instead of failing.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Majors are migrations (Storybook 8 to 10 moves every addon and the
    # ESLint plugin together): done by hand, not one PR per package.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
